name: Deploy PyTorch Image Classification CDK production service

on:
  push:
    branches: [backend-v3]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pytorch-classification-release
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  CDK_CLI_VERSION: 2.1139.0
  ECR_REPOSITORY: pytorch-web

jobs:
  cdk-test:
    name: cdk-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: cdk/uv.lock

      - name: Install pinned CDK CLI
        run: npm install --global "aws-cdk@$CDK_CLI_VERSION"

      - name: Run tests
        working-directory: cdk
        run: |
          uv sync --frozen --group dev
          uv run pytest

  build-docker-images:
    name: build-docker-images
    needs: cdk-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: cdk/uv.lock

      - name: Install pinned CDK CLI
        run: npm install --global "aws-cdk@$CDK_CLI_VERSION"

      - name: Deploy ECR repository stack
        working-directory: cdk
        run: |
          uv sync --frozen --group dev
          cdk deploy PytorchRepositoryStack \
            --require-approval never

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          REGISTRY="$ECR_REGISTRY/$ECR_REPOSITORY"
          BUILD_TAG="${{ github.sha }}"
          echo "REGISTRY=$REGISTRY" >> $GITHUB_ENV
          echo "FLASK_IMAGE=flask-api-$BUILD_TAG" >> $GITHUB_ENV
          echo "JAVA_IMAGE=java-api-$BUILD_TAG" >> $GITHUB_ENV
          echo "REACT_IMAGE=react-front-end-$BUILD_TAG" >> $GITHUB_ENV

      - name: Build Flask/PyTorch backend image
        run: |
          docker build --file backend-flask-pytorch/Dockerfile \
            --tag "$REGISTRY:$FLASK_IMAGE" .

      - name: Push Flask/PyTorch image to ECR
        run: docker push "$REGISTRY:$FLASK_IMAGE"

      - name: Build Java Spring Boot backend image
        run: |
          docker build --file backend-java-spring-boot/Dockerfile \
            --tag "$REGISTRY:$JAVA_IMAGE" .

      - name: Push Java Spring Boot image to ECR
        run: docker push "$REGISTRY:$JAVA_IMAGE"

      - name: Build React frontend image (nginx with React baked in; same pattern as ski shop)
        run: |
          docker build --file frontend/Dockerfile \
            --tag "$REGISTRY:$REACT_IMAGE" .

      - name: Push React image to ECR
        run: docker push "$REGISTRY:$REACT_IMAGE"


  cdk-deploy:
    name: cdk-deploy
    needs: build-docker-images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: cdk/uv.lock

      - name: Install pinned CDK CLI
        run: npm install --global "aws-cdk@$CDK_CLI_VERSION"

      - name: Read shared network settings
        id: network
        working-directory: cdk
        run: python scripts/video_network.py >> "$GITHUB_OUTPUT"

      - name: Deploy application and media
        working-directory: cdk
        env:
          HOSTED_ZONE_ID: ${{ steps.network.outputs.hosted_zone_id }}
          ROUTE_TABLE_ID: ${{ steps.network.outputs.route_table_id }}
          S3_EXISTS: ${{ steps.network.outputs.existing_s3_endpoint }}
          DDB_EXISTS: ${{ steps.network.outputs.existing_dynamodb_endpoint }}
        run: |
          uv sync --frozen --group dev

          FLASK_TAG="flask-api-${{ github.sha }}"
          JAVA_TAG="java-api-${{ github.sha }}"
          REACT_TAG="react-front-end-${{ github.sha }}"

          cdk deploy PytorchClassificationStack PytorchMediaStack \
            --exclusively \
            --require-approval never \
            --parameters PytorchClassificationStack:ImageTagFlask="$FLASK_TAG" \
            --parameters PytorchClassificationStack:ImageTagJava="$JAVA_TAG" \
            --parameters PytorchClassificationStack:ImageTagReact="$REACT_TAG" \
            --parameters PytorchClassificationStack:VideoRouteTableId="$ROUTE_TABLE_ID" \
            --parameters PytorchClassificationStack:VideoExistingS3Endpoint="$S3_EXISTS" \
            --parameters PytorchClassificationStack:VideoExistingDynamodbEndpoint="$DDB_EXISTS" \
            --parameters PytorchMediaStack:HostedZoneId="$HOSTED_ZONE_ID"
