name: pytorch-image-classification

services:
  flask:
    build:
      context: .
      dockerfile: backend-flask-pytorch/Dockerfile
    # Apply Python edits with make dev so file changes do not interrupt video jobs.
    command: ["gunicorn", "-c", "gunicorn.conf.py", "app:app"]
    environment:
      VIDEO_DATA_DIR: /video-data
      VIDEO_YOUTUBE_ENABLED: "true"
      VIDEO_YOUTUBE_TOR: "true"
      VIDEO_TOR_HOST: youtube-tor
    env_file:
      - ./backend-flask-pytorch/.env
    volumes:
      - ./backend-flask-pytorch:/app
      - video-data:/video-data
      - tor-control:/tor-control:ro
      - ./frontend/src/assets/ml_video.mp4:/app/examples/ml-video.mp4:ro
    # Share localhost between containers, matching the production ECS task.
    # Publish ports on the container that owns the network namespace.
    ports:
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5000:5000"

  youtube-tokens:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.0
    init: true
    command: ["--host", "127.0.0.1"]
    network_mode: service:flask
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      - flask
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4416/ping').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  youtube-tor:
    build: ./youtube-tor
    restart: unless-stopped
    mem_limit: 256m
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/lib/tor:size=64m,noexec,nosuid,nodev
      - /run:size=1m,noexec,nosuid,nodev
    volumes:
      - tor-control:/tor-control

  java:
    build:
      context: .
      dockerfile: backend-java-spring-boot/Dockerfile
    environment:
      SERVER_PORT: "8080"
    network_mode: service:flask
    depends_on:
      - flask

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "500"
    # Refresh dependencies inside Docker when the lockfile changes.
    command: ["sh", "-c", "yarn install --frozen-lockfile && yarn dev --host 0.0.0.0 --port 5173 --strictPort"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    network_mode: service:flask
    depends_on:
      - java

volumes:
  video-data:
  tor-control:
