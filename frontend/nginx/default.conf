# Nginx reverse proxy for ECS task (serves React + proxies APIs via localhost).
# AWS_VPC mode requires 127.0.0.1 upstreams — Docker DNS names do not resolve in this network mode.

worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 100M;
    client_body_temp_path /tmp 1 2;

    proxy_buffer_size          128k;
    proxy_buffers              8 256k;
    proxy_busy_buffers_size    256k;
    proxy_max_temp_file_size   0;

    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_vary on;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    server {
        listen       80;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        # ALB health check endpoint.
        location /health {
            access_log off;
            return 200 "ok";
        }

        # API route to Java Spring Boot backend. Strips /api-java-spring-boot prefix so request hits controller paths (/image-url-pytorch, etc.).
        location /api-java-spring-boot/ {
            rewrite ^/api-java-spring-boot/(.*) /$1 break;
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API route to Flask/PyTorch backend. Strips /api-flask-pytorch-models prefix so request hits routes (/api-pytorch/image-url-pytorch, etc.).
        location /api-flask-pytorch-models/ {
            rewrite ^/api-flask-pytorch-models/(.*) /$1 break;
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Serve React static files (fallback to index.html for SPA routing).
        location / {
            try_files $uri $uri/ /index.html;
        }

        error_page 404 /index.html;
    }
}
